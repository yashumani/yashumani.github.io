<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Knowledge and Research Runtime architecture</title>
  <desc id="desc">A visual pipeline showing source adapters, extraction, evidence graph, retrieval, knowledge compilation, critique and repair, and cited artifact publishing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-fill" />
    </marker>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="1" stop-color="#f8f4ff"/>
    </linearGradient>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1a1a1a;
        --muted: #656575;
        --border: #dfe2f2;
        --panel: #f8f9ff;
        --accent: #5468d4;
        --accent-soft: #eef0ff;
        --rail: #f5f6fb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --text: #e9e9ea;
          --muted: #a3a3ad;
          --border: #343748;
          --panel: #181a23;
          --accent: #8b9bf0;
          --accent-soft: #202438;
          --rail: #171820;
        }
      }
      .bg { fill: var(--bg); }
      .title { fill: var(--text); font: 700 34px Inter, Segoe UI, Arial, sans-serif; }
      .subtitle { fill: var(--muted); font: 500 17px Inter, Segoe UI, Arial, sans-serif; }
      .label { fill: var(--text); font: 700 18px Inter, Segoe UI, Arial, sans-serif; }
      .small { fill: var(--muted); font: 500 13px Inter, Segoe UI, Arial, sans-serif; }
      .tiny { fill: var(--muted); font: 600 12px Inter, Segoe UI, Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
      .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
      .source { fill: var(--accent-soft); stroke: var(--border); stroke-width: 1.2; }
      .accent { fill: var(--accent); }
      .line { stroke: var(--accent); stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: var(--border); stroke-width: 1.4; fill: none; }
      .arrow-fill { fill: var(--accent); }
      .rail { fill: var(--rail); stroke: var(--border); stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720" rx="28"/>

  <text x="70" y="70" class="title">Agentic Knowledge &amp; Research Runtime</text>
  <text x="70" y="104" class="subtitle">Source-grounded research pipeline with evidence tracing, critique review, and durable orchestration.</text>

  <rect x="70" y="145" width="250" height="380" rx="22" class="panel"/>
  <text x="100" y="185" class="tiny">Source layer</text>
  <text x="100" y="218" class="label">13 source adapters</text>
  <text x="100" y="248" class="small">discover → fetch → extract</text>

  <g transform="translate(100 285)">
    <rect width="85" height="38" rx="19" class="source"/><text x="42.5" y="24" text-anchor="middle" class="small">Web</text>
    <rect x="100" width="105" height="38" rx="19" class="source"/><text x="152.5" y="24" text-anchor="middle" class="small">YouTube</text>
    <rect y="58" width="105" height="38" rx="19" class="source"/><text x="52.5" y="82" text-anchor="middle" class="small">GitHub</text>
    <rect x="120" y="58" width="85" height="38" rx="19" class="source"/><text x="162.5" y="82" text-anchor="middle" class="small">arXiv</text>
    <rect y="116" width="88" height="38" rx="19" class="source"/><text x="44" y="140" text-anchor="middle" class="small">RSS</text>
    <rect x="103" y="116" width="102" height="38" rx="19" class="source"/><text x="154" y="140" text-anchor="middle" class="small">PDFs</text>
  </g>

  <path d="M320 335 C365 335, 365 335, 405 335" class="line"/>

  <g transform="translate(405 158)">
    <rect width="230" height="95" rx="18" class="panel"/>
    <circle cx="38" cy="48" r="17" class="accent" opacity=".14"/>
    <text x="70" y="42" class="label">Extraction &amp; parsing</text>
    <text x="70" y="67" class="small">chunks, tables, media, metadata</text>
  </g>
  <path d="M635 205 C675 205, 675 205, 715 205" class="line"/>

  <g transform="translate(715 145)">
    <rect width="250" height="120" rx="20" fill="url(#panelGrad)" stroke="#dfe2f2" stroke-width="1.5"/>
    <text x="30" y="42" class="label">Evidence graph</text>
    <text x="30" y="70" class="small">claims, chunks, sources, citations</text>
    <text x="30" y="95" class="small">auditable support for every answer</text>
  </g>
  <path d="M840 265 L840 315" class="line"/>

  <g transform="translate(405 315)">
    <rect width="230" height="95" rx="18" class="panel"/>
    <text x="30" y="42" class="label">Hybrid retrieval</text>
    <text x="30" y="67" class="small">keyword + vector + rerank</text>
  </g>
  <path d="M715 365 C675 365, 675 365, 635 365" class="line"/>

  <path d="M635 365 C676 365, 676 365, 715 365" class="soft-line"/>
  <g transform="translate(715 315)">
    <rect width="250" height="100" rx="18" class="panel"/>
    <text x="30" y="43" class="label">Knowledge compiler</text>
    <text x="30" y="68" class="small">structured, cited artifact draft</text>
  </g>
  <path d="M965 365 C1002 365, 1002 365, 1040 365" class="line"/>

  <g transform="translate(405 470)">
    <rect width="230" height="95" rx="18" class="panel"/>
    <text x="30" y="42" class="label">Critique / repair</text>
    <text x="30" y="67" class="small">unsupported claims are challenged</text>
  </g>
  <path d="M840 415 C840 462, 790 518, 635 518" class="line"/>
  <path d="M635 518 C750 600, 990 570, 1040 420" class="line"/>

  <g transform="translate(1040 302)">
    <rect width="100" height="126" rx="18" class="panel"/>
    <text x="50" y="38" text-anchor="middle" class="label">Cited</text>
    <text x="50" y="63" text-anchor="middle" class="label">research</text>
    <text x="50" y="88" text-anchor="middle" class="label">artifact</text>
  </g>

  <g transform="translate(70 590)">
    <rect width="1060" height="58" rx="18" class="rail"/>
    <text x="32" y="36" class="tiny">Operational guardrails</text>
    <text x="245" y="36" class="small">Temporal durable workflows</text>
    <text x="485" y="36" class="small">DSPy typed programs</text>
    <text x="690" y="36" class="small">Promptfoo evaluation gates</text>
    <text x="925" y="36" class="small">MLflow run history</text>
  </g>
</svg>
