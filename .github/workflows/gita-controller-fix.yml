name: Gita Sadhana — One-Time Controller Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gita-controller-fix.yml

permissions:
  contents: write

jobs:
  patch-controller:
    name: Repair durable GitHub output and summary writes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Patch the controller safely
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const file = 'gita-sadhana/automation/gita-automation.mjs';
          let source = await readFile(file, 'utf8');

          const oldImport = 'import { constants as fsConstants } from "node:fs";';
          const newImport = 'import { constants as fsConstants, appendFileSync } from "node:fs";';
          if (source.includes(oldImport)) {
            source = source.replace(oldImport, newImport);
          } else if (!source.includes(newImport)) {
            throw new Error('Could not locate the node:fs import to patch.');
          }

          const oldFunction = `function requireAppend(filePath, text) {
            execFileSync("bash", ["-lc", \`printf '%s' "$1" >> "$2"\`, "_", text, filePath], {
              stdio: "ignore"
            });
          }`;
          const newFunction = `function requireAppend(filePath, text) {
            appendFileSync(filePath, text, "utf8");
          }`;
          if (source.includes(oldFunction)) {
            source = source.replace(oldFunction, newFunction);
          } else if (!source.includes(newFunction)) {
            throw new Error('Could not locate the output helper to patch.');
          }

          await writeFile(file, source, 'utf8');
          NODE

      - name: Validate the repaired controller
        run: |
          set -euo pipefail
          node --check gita-sadhana/automation/gita-automation.mjs
          node gita-sadhana/automation/gita-automation.mjs self-test
          output_file="$(mktemp)"
          summary_file="$(mktemp)"
          GITHUB_OUTPUT="$output_file" GITHUB_STEP_SUMMARY="$summary_file" \
            node gita-sadhana/automation/gita-automation.mjs self-test
          test -f "$output_file"
          test -f "$summary_file"

      - name: Commit the controller repair
        run: |
          set -euo pipefail
          git config user.name "Gita Sadhana Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gita-sadhana/automation/gita-automation.mjs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Fix Gita automation output persistence"
            git push origin HEAD:main
          fi
