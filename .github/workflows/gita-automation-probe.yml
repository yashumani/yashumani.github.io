name: Gita automation capability probe

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gita-automation-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    name: Verify unattended AI generation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify non-interactive Copilot access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot --yolo -p "Reply with exactly GITA_AUTOMATION_READY and nothing else." | tee /tmp/gita-probe.txt
          grep -Fxq "GITA_AUTOMATION_READY" /tmp/gita-probe.txt
