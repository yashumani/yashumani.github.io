name: Gita Sadhana — 9 AM Website Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "7 9 * * *"
      timezone: America/New_York

concurrency:
  group: gita-sadhana-publication
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  validate-publish-verify:
    name: Publish the exact staged lesson and verify GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the public study site
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run deterministic guardrail self-test
        run: node gita-sadhana/automation/gita-automation.mjs self-test

      - name: Validate the staged packet and prepare files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .automation-cache/publication-receipt.json
          for attempt in 1 2 3 4 5 6; do
            node gita-sadhana/automation/gita-automation.mjs publish
            if [ -s .automation-cache/publication-receipt.json ]; then
              break
            fi
            completed="$(node -e "const p=require('./gita-sadhana/gita-progress.json'); process.stdout.write(String(p.completedSequentialVerses));")"
            if [ "$completed" = "701" ]; then
              break
            fi
            if [ "$attempt" != "6" ]; then
              sleep 5
            fi
          done

      - name: Classify publication state from durable files
        id: state
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          const output = process.env.GITHUB_OUTPUT;
          const write = (name, value) => appendFileSync(output, `${name}=${String(value)}\n`, 'utf8');
          const progress = JSON.parse(readFileSync('gita-sadhana/gita-progress.json', 'utf8'));
          const receiptPath = '.automation-cache/publication-receipt.json';

          if (!existsSync(receiptPath)) {
            write('packet_found', 'false');
            write('journey_complete', progress.completedSequentialVerses === 701 ? 'true' : 'false');
            write('did_change', 'false');
            process.exit(0);
          }

          const receipt = JSON.parse(readFileSync(receiptPath, 'utf8'));
          const ids = receipt.lessonIds || [];
          if (!ids.length) throw new Error('Publication receipt has no lesson IDs.');
          const first = ids[0].replace(/^bg-0?/, '').replace('-', '.').replace(/^0/, '');
          const last = ids.at(-1).replace(/^bg-0?/, '').replace('-', '.').replace(/^0/, '');
          const label = ids.length === 1 ? `BG ${first}` : `BG ${first}–${last}`;

          write('packet_found', 'true');
          write('journey_complete', 'false');
          write('did_change', receipt.changed ? 'true' : 'false');
          write('published_ids', ids.join(','));
          write('commit_message', `Publish Gita lesson ${receipt.packetRunDate}: ${label}`);
          NODE

      - name: Alert when no staged packet exists
        if: steps.state.outputs.packet_found == 'false' && steps.state.outputs.journey_complete != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_STAGE: 9-am-no-packet
          ALERT_MESSAGE: The website publisher found no staged daily lesson after its retry window. Public progress was left unchanged.
        run: node gita-sadhana/automation/gita-automation.mjs alert

      - name: Commit the atomic lesson publication
        if: steps.state.outputs.packet_found == 'true' && steps.state.outputs.did_change == 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.state.outputs.commit_message }}
        run: |
          set -euo pipefail
          git config user.name "Gita Sadhana Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gita-sadhana/content/lessons \
            gita-sadhana/content/manifest.json \
            gita-sadhana/gita-progress.json
          git diff --cached --check
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:main

      - name: Verify the deployed public state
        if: steps.state.outputs.packet_found == 'true'
        run: node gita-sadhana/automation/gita-automation.mjs verify

      - name: Close the processed staging issue
        if: steps.state.outputs.packet_found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node gita-sadhana/automation/gita-automation.mjs close

      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gita-publication-${{ github.run_id }}
          path: .automation-cache/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Create a fail-safe alert
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_STAGE: 9-am-publisher
          ALERT_MESSAGE: The staged packet could not be fully validated, committed, deployed, verified, or closed. The staging issue remains open for a safe retry.
        run: node gita-sadhana/automation/gita-automation.mjs alert
