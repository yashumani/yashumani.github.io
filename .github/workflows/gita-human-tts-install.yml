name: Gita Sadhana — Install Natural English Voice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/gita-human-tts-install.yml

permissions:
  contents: write

jobs:
  install-and-smoke-test:
    name: Integrate Kokoro, synthesize real audio, and publish only after validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the latest site
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Link the natural voice assets and add permanent browser tests
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const sitePath = 'gita-sadhana/site.htm';
          let html = await readFile(sitePath, 'utf8');

          if (!html.includes('human-tts.css')) {
            html = html.replace(
              '<link rel="stylesheet" href="styles.css">',
              '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="human-tts.css">'
            );
          }

          if (!html.includes('human-tts.js')) {
            html = html.replace(
              '<script type="module" src="app.js"></script>',
              '<script type="module" src="app.js"></script>\n  <script type="module" src="human-tts.js"></script>'
            );
          }

          await writeFile(sitePath, html, 'utf8');

          const test = `import { test, expect } from '@playwright/test';

          test.describe('Gita Sadhana natural English voice', () => {
            test('loads the lazy Kokoro controls without downloading the model', async ({ page }) => {
              const errors = [];
              page.on('pageerror', (error) => errors.push(error.message));
              await page.goto('/gita-sadhana/', { waitUntil: 'domcontentloaded' });
              await expect(page.locator('#natural-voice-status')).toBeVisible();
              await expect(page.locator('#natural-voice-select')).toHaveValue('af_heart');
              await expect(page.locator('.listen-button[data-speak-lang^="en"]').first()).toContainText('natural English');

              const status = await page.evaluate(() => window.gitaHumanTTS?.getStatus());
              expect(status).toMatchObject({
                workerCreated: false,
                modelReady: false,
                modelId: undefined,
                voice: 'af_heart',
              });
              expect(window).toBeTruthy();
              expect(errors).toEqual([]);
            });

            test('synthesizes real WAV audio with Kokoro in the browser', async ({ page }) => {
              test.skip(process.env.GITA_TTS_NETWORK_SMOKE !== '1', 'One-time network/model smoke test');
              test.setTimeout(720_000);

              const consoleErrors = [];
              page.on('console', (message) => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', (error) => consoleErrors.push(error.message));

              await page.goto('/gita-sadhana/', { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => Boolean(window.gitaHumanTTS), null, { timeout: 30_000 });
              const result = await page.evaluate(() => window.gitaHumanTTS.testSynthesis(
                'The Bhagavad Gita invites us to act with attention, courage, and compassion.',
                { voice: 'af_heart', speed: 0.96, timeoutMs: 660_000 }
              ));

              expect(result.modelId).toBe('onnx-community/Kokoro-82M-v1.0-ONNX');
              expect(result.dtype).toBe('q8');
              expect(result.device).toBe('wasm');
              expect(result.mimeType).toContain('audio');
              expect(result.chunks).toBeGreaterThanOrEqual(1);
              expect(result.durationSeconds).toBeGreaterThan(1);
              expect(result.bytes).toBeGreaterThan(10_000);
              expect(consoleErrors).toEqual([]);
            });
          });
          `;

          await writeFile('tests/gita-human-tts.spec.mjs', test.replace(/^          /gm, ''), 'utf8');
          NODE

      - name: Validate JavaScript syntax and local references
        run: |
          node --check gita-sadhana/human-tts.js
          node --check gita-sadhana/human-tts-worker.js
          node --check tests/gita-human-tts.spec.mjs
          npm install --no-audit --no-fund
          npm run check:static
          npm run check:syntax

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test the interface without loading the model
        run: npx playwright test tests/gita-human-tts.spec.mjs --project=desktop-chromium --grep "lazy Kokoro"

      - name: Download the real Hugging Face model and synthesize a WAV sample
        env:
          GITA_TTS_NETWORK_SMOKE: "1"
        run: npx playwright test tests/gita-human-tts.spec.mjs --project=desktop-chromium --grep "real WAV"

      - name: Record the successful model receipt
        run: |
          cat > gita-sadhana/human-tts-verification.json <<'JSON'
          {
            "schemaVersion": "GITA_HUMAN_TTS_VERIFICATION_V1",
            "model": "onnx-community/Kokoro-82M-v1.0-ONNX",
            "runtime": "kokoro-js@1.2.1",
            "device": "wasm",
            "dtype": "q8",
            "defaultVoice": "af_heart",
            "test": "Real browser-side WAV synthesis completed in Playwright Chromium",
            "verifiedBy": "GitHub Actions"
          }
          JSON

      - name: Commit the tested integration
        run: |
          set -euo pipefail
          git config user.name "Gita Sadhana Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gita-sadhana/site.htm \
            gita-sadhana/human-tts-verification.json \
            tests/gita-human-tts.spec.mjs
          git diff --cached --check
          git commit -m "Enable human-like Kokoro English narration"
          git push origin HEAD:main

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gita-human-tts-verification-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            gita-sadhana/human-tts-verification.json
          if-no-files-found: ignore
          retention-days: 14
