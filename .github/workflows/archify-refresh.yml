name: Archify refresh and browser evidence
on:
  workflow_dispatch:
  push:
    branches: [agent/archify-architecture-refresh]
    paths:
      - architecture/definitions.json
      - scripts/*archify.mjs
      - js/archify.js
      - css/archify.css
      - tests/archify.spec.mjs
      - .github/workflows/archify-refresh.yml
permissions:
  contents: read
concurrency:
  group: archify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate-and-review:
    if: github.ref == 'refs/heads/agent/archify-architecture-refresh'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/archify-architecture-refresh
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch digest-checked Archify source
        run: |
          curl --fail --location --retry 2 https://raw.githubusercontent.com/tt-a1i/archify/5769acefcc2ebd696a4f9ed3ac9cb6cca1d75c70/archify.zip -o "$RUNNER_TEMP/archify.zip"
          echo "78cbac0afc4c4368de601fefc8767c904a33442f769eda421cd95fa568ff5dd8  $RUNNER_TEMP/archify.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/archify.zip" -d "$RUNNER_TEMP/archify-tool"
      - name: Generate and validate 36 actual Archify readers
        env:
          ARCHIFY_UPDATE_CHECK_DISABLED: '1'
        run: |
          export ARCHIFY_HOME="$RUNNER_TEMP/archify-tool/archify"
          node scripts/build-archify.mjs
          node scripts/check-archify.mjs
          rm -f .github/workflows/archify-source-review.yml
      - name: Commit generated readers and integration to the draft branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add architecture projects index.html professional-profile.html scripts/validate-site.mjs tests/portfolio-content.mjs package.json
          git add -u .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'Generate 36 validated Archify maps and integrate the architecture atlas'
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:agent/archify-architecture-refresh
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/archify-reviewed-commit.txt"
      - name: Install browser-test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Static and syntax checks
        run: npm run check:static && npm run check:syntax
      - name: Complete portfolio and Archify browser tests
        run: npm run test:e2e
      - name: Archify canonical viewport and theme evidence
        if: always()
        env:
          ARCHIFY_UPDATE_CHECK_DISABLED: '1'
        run: |
          node -e "const c=require('./architecture/catalog.json');for(const p of c.projects)for(const v of p.views)console.log('architecture/'+v.map)" > "$RUNNER_TEMP/archify-maps.txt"
          export ARCHIFY_CLI="$RUNNER_TEMP/archify-tool/archify/bin/archify.mjs"
          export ARCHIFY_CHROME="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          test -x "$ARCHIFY_CHROME"
          cat "$RUNNER_TEMP/archify-maps.txt" | xargs -P 2 -I MAP sh -c 'node "$ARCHIFY_CLI" visual-check "MAP" --json > "${MAP%.html}.browser.json"'
      - name: Upload exact reader and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archify-review
          path: |
            architecture
            test-results
            playwright-report
            ${{ runner.temp }}/archify-reviewed-commit.txt
          retention-days: 7
