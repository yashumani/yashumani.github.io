name: Gita Sadhana — End-to-End Installation Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gita-install-verification.yml

concurrency:
  group: gita-sadhana-installation-test
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  copilot-requests: write

jobs:
  run-first-production-cycle:
    name: Generate, deliver, publish, deploy, and verify the first lesson
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install source and AI tooling
        run: |
          set -euo pipefail
          command -v pdftotext >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          }
          npm install -g @github/copilot

      - name: Validate all deterministic guardrails
        run: node gita-sadhana/automation/gita-automation.mjs self-test

      - name: Prepare verified official and immutable sources
        id: prepare
        run: node gita-sadhana/automation/source-preflight.mjs

      - name: Confirm the exact source evidence
        run: |
          set -euo pipefail
          test -s .automation-cache/sivananda-gita.pdf
          test -s .automation-cache/sivananda-gita.txt
          test -s .automation-cache/verse-source-bg-01-001.json
          test -s .automation-cache/verse-source-bg-01-002.json
          test -s .automation-cache/source-manifest.json
          test -s .automation-cache/teacher-prompt.txt
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('.automation-cache/source-manifest.json', 'utf8'));
          if (manifest.targetLabel !== 'BG 1.1–1.2') throw new Error(`Unexpected target: ${manifest.targetLabel}`);
          if (manifest.sourceVerification.sanskritCorpus.totalVerses !== 701) throw new Error('Corpus total mismatch.');
          if (!manifest.targets[0].sanskritDevanagari.includes('धर्मक्षेत्रे')) throw new Error('BG 1.1 Sanskrit evidence mismatch.');
          if (!manifest.targets[1].sanskritDevanagari.includes('दृष्ट्वा तु पाण्डवानीकं')) throw new Error('BG 1.2 Sanskrit evidence mismatch.');
          NODE

      - name: Generate the real first listening lesson
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          copilot --yolo -p "$(cat .automation-cache/teacher-prompt.txt)" \
            | tee .automation-cache/copilot-output.txt

      - name: Validate and deliver the listening lesson
        id: stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node gita-sadhana/automation/gita-automation.mjs stage

      - name: Validate the staged packet and prepare publication
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node gita-sadhana/automation/gita-automation.mjs publish

      - name: Commit the exact lesson, manifest, and progress atomically
        if: steps.publish.outputs.did_change == 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.publish.outputs.commit_message }}
        run: |
          set -euo pipefail
          git config user.name "Gita Sadhana Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gita-sadhana/content/lessons \
            gita-sadhana/content/manifest.json \
            gita-sadhana/gita-progress.json
          git diff --cached --check
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:main

      - name: Verify the public GitHub Pages deployment
        id: verify
        run: node gita-sadhana/automation/gita-automation.mjs verify

      - name: Close the processed staging issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node gita-sadhana/automation/gita-automation.mjs close

      - name: Preserve complete installation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gita-end-to-end-installation-${{ github.run_id }}
          path: .automation-cache/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Create a fail-safe installation alert
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_STAGE: end-to-end-installation
          ALERT_MESSAGE: The first production cycle did not complete every source, generation, validation, publication, deployment, and issue-closing check. No unverified progress should be accepted.
        run: node gita-sadhana/automation/gita-automation.mjs alert
