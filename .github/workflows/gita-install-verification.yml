name: Gita Sadhana — Installation Verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gita-install-verification.yml

permissions:
  contents: read

jobs:
  inspect-official-source:
    name: Inspect the migrated Gita Supersite data interface
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download migrated site assets
        run: |
          set -euo pipefail
          mkdir -p .automation-cache
          curl --fail --location --silent --show-error \
            https://www.gitasupersite.in/ \
            --output .automation-cache/gitasupersite-home.html
          asset="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' .automation-cache/gitasupersite-home.html | head -1)"
          test -n "$asset"
          printf '%s\n' "$asset" > .automation-cache/gitasupersite-asset-path.txt
          curl --fail --location --silent --show-error \
            "https://www.gitasupersite.in${asset}" \
            --output .automation-cache/gitasupersite-app.js

      - name: Extract endpoint candidates
        run: |
          set -euo pipefail
          {
            grep -oE 'https?://[^"'"'"'[:space:]\\]+' .automation-cache/gitasupersite-app.js || true
            grep -oE '/(api|data|assets)/[A-Za-z0-9_?&=./${}:-]+' .automation-cache/gitasupersite-app.js || true
            grep -oE '[A-Za-z0-9_./-]+\.(json|sqlite|db)' .automation-cache/gitasupersite-app.js || true
          } | sort -u > .automation-cache/endpoint-candidates.txt
          grep -n -E -m 200 'api|shloka|verse|chapter|supabase|graphql|firebase|fetch\(' \
            .automation-cache/gitasupersite-app.js \
            > .automation-cache/endpoint-context.txt || true

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gita-source-interface-${{ github.run_id }}
          path: .automation-cache/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
