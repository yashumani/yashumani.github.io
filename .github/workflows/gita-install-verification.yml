name: Gita Sadhana — Installation Verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gita-install-verification.yml

permissions:
  contents: read
  copilot-requests: write

jobs:
  verify-installation:
    name: Verify sources, sequencing, prompt, and unattended AI access
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install required tooling
        run: |
          set -euo pipefail
          command -v pdftotext >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          }
          npm install -g @github/copilot

      - name: Run deterministic self-test
        run: node gita-sadhana/automation/gita-automation.mjs self-test

      - name: Run the real source preflight without publishing
        id: prepare
        run: node gita-sadhana/automation/gita-automation.mjs prepare

      - name: Validate downloaded source evidence
        run: |
          set -euo pipefail
          test -s .automation-cache/sivananda-gita.txt
          test -s .automation-cache/gita-supersite-1-1.txt
          test -s .automation-cache/gita-supersite-1-2.txt
          test -s .automation-cache/teacher-prompt.txt
          grep -Fq 'धर्मक्षेत्रे कुरुक्षेत्रे' .automation-cache/gita-supersite-1-1.txt
          grep -Fq 'BG 1.1–1.2' .automation-cache/source-manifest.json

      - name: Verify Copilot can read the prepared local evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot --yolo -p "Read .automation-cache/source-manifest.json and .automation-cache/gita-supersite-1-1.txt. Confirm that the target includes Bhagavad Gita 1.1 and that the Sanskrit source file contains धर्मक्षेत्रे कुरुक्षेत्रे. Reply with exactly GITA_SOURCE_READY and nothing else." \
            | tee .automation-cache/install-verification-output.txt
          grep -Fxq 'GITA_SOURCE_READY' .automation-cache/install-verification-output.txt

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gita-install-verification-${{ github.run_id }}
          path: .automation-cache/
          if-no-files-found: ignore
          retention-days: 7
