name: Gita Sadhana — Repair Three Transcription Errors Once

on:
  push:
    branches: [main]
    paths: [gita-sadhana/automation/transcription-repairs.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: gita-sadhana-publication
  cancel-in-progress: false

jobs:
  repair-and-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const repo = context.repo;
            const ref = (await github.rest.git.getRef({...repo,ref:'heads/main'})).data;
            const base = ref.object.sha;
            const commit = (await github.rest.git.getCommit({...repo,commit_sha:base})).data;
            const read = async path => {
              const f=(await github.rest.repos.getContent({...repo,path,ref:base})).data;
              return {sha:f.sha,text:Buffer.from(f.content,'base64').toString('utf8')};
            };
            const request=JSON.parse((await read('gita-sadhana/automation/transcription-repairs.json')).text);
            assert.equal(request.schemaVersion,'GITA_TRANSCRIPTION_REPAIRS_V1');
            assert.deepEqual(request.repairs.map(r=>r.id),['bg-02-007','bg-02-047','bg-02-048']);
            const source=await read('gita-sadhana/data/sanskrit-701.json');
            assert.equal(source.sha,'88f05a083dd331b2b7e7a7af9e249971df9e5f67');
            const corpus=JSON.parse(source.text);
            const tree=[],audit=[];
            for(const item of request.repairs) {
              const file=`gita-sadhana/content/lessons/${item.id}.json`;
              const original=await read(file),lesson=JSON.parse(original.text);
              const canonical=corpus.verses.find(v=>v.id===item.id); assert(canonical);
              const fields=item.id==='bg-02-007'?['sanskritDevanagari']:['sanskritDevanagari','transliteration'];
              if(fields.every(f=>lesson[f]===canonical[f])) continue;
              assert.equal(original.sha,item.expectedBlobSha,`${item.id}: unexpected concurrent edit`);
              const before=JSON.parse(original.text),changes=[];
              for(const field of fields) {
                const value=lesson[field];
                const mechanical=item.id==='bg-02-007'?value.replace('\naपृच्छामि','\nपृच्छामि'):value.replaceAll('\\n','\n');
                assert.equal(mechanical,canonical[field],`${item.id}: repair would exceed the verified transcription correction`);
                lesson[field]=mechanical;
                if(value!==mechanical)changes.push({field,before:value,after:mechanical});
              }
              for(const field of Object.keys(before)) if(!fields.includes(field))assert.deepEqual(lesson[field],before[field]);
              tree.push({path:file,mode:'100644',type:'blob',content:JSON.stringify(lesson,null,2)+'\n'});
              audit.push({id:item.id,previousBlobSha:original.sha,changes,explanationsRewritten:false});
            }
            if(tree.length) {
              tree.push({path:'gita-sadhana/content/transcription-corrections-2026-10-04.json',mode:'100644',type:'blob',content:JSON.stringify({schemaVersion:'GITA_TRANSCRIPTION_CORRECTIONS_V1',sourceBlobSha:source.sha,sourcePath:'gita-sadhana/data/sanskrit-701.json',baseCommit:base,corrections:audit,scope:'Remove one stray Latin a and replace literal newline escape artifacts. Explanatory content, dates, sequence, progress and original issue packets remain unchanged.'},null,2)+'\n'});
              const newTree=(await github.rest.git.createTree({...repo,base_tree:commit.tree.sha,tree})).data;
              const result=(await github.rest.git.createCommit({...repo,message:'Repair exact-source transcription artifacts in BG 2.7, 2.47 and 2.48; preserve all explanations',tree:newTree.sha,parents:[base]})).data;
              await github.rest.git.updateRef({...repo,ref:'heads/main',sha:result.sha,force:false});
              core.summary.addHeading('Verified transcription repair').addRaw(`Three narrowly scoped source repairs committed: ${result.sha}. No lesson explanation was rewritten.`).write();
            }
            await github.rest.actions.createWorkflowDispatch({...repo,workflow_id:'gita-complete.yml',ref:'main'});
            const issue=(await github.rest.issues.get({...repo,issue_number:90})).data;
            const body=issue.body.split('\n## Latest bulk run')[0];
            await github.rest.issues.update({...repo,issue_number:90,body:body+'\n## Latest bulk run\n\nThe initial source audit stopped before generation because three historical Sanskrit fields contained transcription artifacts. A bounded correction removed the stray Latin a in BG 2.7 and literal newline escapes in BG 2.47/2.48 Sanskrit and transliteration, using the pinned source. All explanations and original staging issues remain unchanged. An audit file records every before/after value. The one-shot complete-archive workflow has been dispatched again; completion is not yet claimed.\n'});
