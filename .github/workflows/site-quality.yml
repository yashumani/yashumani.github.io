name: Site quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Static, responsive, and interaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Validate site structure and local links
        run: npm run check:static

      - name: Validate JavaScript syntax
        run: npm run check:syntax

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser checks
        run: npm run test:e2e

      - name: Upload browser report and visual artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-quality-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
